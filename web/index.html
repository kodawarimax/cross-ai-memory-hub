<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Archive - Codex & Claude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .prose pre { background-color: #18181b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
    .prose code { color: #f43f5e; font-size: 0.875rem; }
    .prose pre code { color: inherit; font-size: 0.875rem; }
    mark { background-color: #fef08a; color: #1f2937; padding: 0.1rem 0.25rem; border-radius: 0.2rem; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
        💬
      </div>
      <div>
        <h1 class="text-lg font-bold text-gray-900 leading-tight">AI Chat Archive</h1>
        <p class="text-xs text-gray-500">Codex & Claude Cross-Agent History</p>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="flex items-center space-x-3 w-1/2 max-w-xl">
      <div class="relative flex-1">
        <input id="searchInput" type="text" placeholder="キーワード・タスク名・ファイル名で検索..." 
          class="w-full pl-9 pr-4 py-1.5 text-sm bg-gray-100 border border-transparent rounded-lg focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition outline-none" />
        <span class="absolute left-3 top-2 text-gray-400 text-sm">🔍</span>
      </div>
      <div class="flex bg-gray-100 p-1 rounded-lg text-xs font-medium border border-gray-200">
        <button class="filter-btn px-2.5 py-1 rounded bg-white text-gray-900 shadow-xs" data-provider="all">All</button>
        <button class="filter-btn px-2.5 py-1 rounded text-gray-600 hover:text-gray-900" data-provider="codex">Codex</button>
        <button class="filter-btn px-2.5 py-1 rounded text-gray-600 hover:text-gray-900" data-provider="claude">Claude</button>
      </div>
    </div>

    <!-- Quick Stats -->
    <div id="statsBadge" class="text-xs text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full font-mono">
      Loading...
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Sidebar: Session List -->
    <aside class="w-96 border-r border-gray-200 bg-white flex flex-col shrink-0">
      <div class="p-3 border-b border-gray-100 flex items-center justify-between text-xs text-gray-500">
        <span id="sessionListCount">0 セッション</span>
        <button id="refreshBtn" class="hover:text-indigo-600 font-medium">🔄 更新</button>
      </div>
      <div id="sessionList" class="flex-1 overflow-y-auto divide-y divide-gray-100">
        <!-- Sessions will be loaded here -->
      </div>
    </aside>

    <!-- Main View: Chat Detail -->
    <main class="flex-1 flex flex-col bg-gray-50 overflow-hidden">
      
      <!-- Session Header Bar -->
      <div id="sessionHeader" class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 hidden">
        <div class="min-w-0 pr-4">
          <div class="flex items-center space-x-2 mb-1">
            <span id="badgeProvider" class="px-2 py-0.5 text-xs font-bold rounded uppercase"></span>
            <span id="sessionTime" class="text-xs text-gray-400 font-mono"></span>
          </div>
          <h2 id="sessionTitle" class="text-base font-bold text-gray-900 truncate"></h2>
          <p id="sessionProject" class="text-xs text-gray-500 truncate font-mono mt-0.5"></p>
        </div>

        <!-- Detail Controls -->
        <div class="flex items-center space-x-3 shrink-0">
          <label class="flex items-center space-x-1.5 text-xs text-gray-600 cursor-pointer">
            <input type="checkbox" id="toggleThinking" class="rounded text-indigo-600 focus:ring-0">
            <span>🧠 思考ログ</span>
          </label>
          <label class="flex items-center space-x-1.5 text-xs text-gray-600 cursor-pointer">
            <input type="checkbox" id="toggleTools" class="rounded text-indigo-600 focus:ring-0">
            <span>🛠️ ツール実行</span>
          </label>
          <button id="copyMdBtn" class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded font-medium transition">
            📋 Markdownコピー
          </button>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-gray-400 p-8">
        <div class="text-5xl mb-3">💬</div>
        <p class="text-sm font-medium">左側のリストからセッションを選択するか、キーワードで検索してください</p>
      </div>

      <!-- Messages Stream -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-6 space-y-6 hidden">
        <!-- Rendered messages -->
      </div>
    </main>

  </div>

  <script>
    let currentProvider = "all";
    let currentSearch = "";
    let selectedSessionId = null;
    let currentSessionData = null;

    const searchInput = document.getElementById("searchInput");
    const sessionList = document.getElementById("sessionList");
    const sessionListCount = document.getElementById("sessionListCount");
    const statsBadge = document.getElementById("statsBadge");
    const sessionHeader = document.getElementById("sessionHeader");
    const emptyState = document.getElementById("emptyState");
    const messagesContainer = document.getElementById("messagesContainer");
    const sessionTitle = document.getElementById("sessionTitle");
    const sessionProject = document.getElementById("sessionProject");
    const sessionTime = document.getElementById("sessionTime");
    const badgeProvider = document.getElementById("badgeProvider");
    const toggleThinking = document.getElementById("toggleThinking");
    const toggleTools = document.getElementById("toggleTools");
    const copyMdBtn = document.getElementById("copyMdBtn");

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Event listeners
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("bg-white", "text-gray-900", "shadow-xs");
          b.classList.add("text-gray-600");
        });
        btn.classList.add("bg-white", "text-gray-900", "shadow-xs");
        btn.classList.remove("text-gray-600");
        currentProvider = btn.getAttribute("data-provider");
        loadSessions();
      });
    });

    let searchTimer = null;
    searchInput.addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentSearch = e.target.value.trim();
        loadSessions();
      }, 300);
    });

    document.getElementById("refreshBtn").addEventListener("click", () => loadSessions());
    toggleThinking.addEventListener("change", () => renderMessages());
    toggleTools.addEventListener("change", () => renderMessages());

    copyMdBtn.addEventListener("click", async () => {
      if (!selectedSessionId) return;
      try {
        const th = toggleThinking.checked ? "1" : "0";
        const tl = toggleTools.checked ? "1" : "0";
        const res = await fetch(`/api/session/${selectedSessionId}/markdown?thinking=${th}&tools=${tl}`);
        const text = await res.text();
        await navigator.clipboard.writeText(text);
        const originalText = copyMdBtn.textContent;
        copyMdBtn.textContent = "✅ コピー完了！";
        setTimeout(() => copyMdBtn.textContent = originalText, 1500);
      } catch (e) {
        alert("コピーに失敗しました: " + e);
      }
    });

    async function loadSessions() {
      sessionList.innerHTML = `<div class="p-6 text-center text-xs text-gray-400">読み込み中...</div>`;
      try {
        const params = new URLSearchParams({
          provider: currentProvider,
          q: currentSearch,
          limit: "60"
        });
        const res = await fetch(`/api/sessions?${params}`);
        const data = await res.json();
        const sessions = data.sessions || [];

        sessionListCount.textContent = `${sessions.length} 件表示`;
        statsBadge.textContent = `Provider: ${currentProvider.toUpperCase()}`;

        if (sessions.length === 0) {
          sessionList.innerHTML = `<div class="p-6 text-center text-xs text-gray-400">該当するセッションがありません</div>`;
          return;
        }

        sessionList.innerHTML = sessions.map(s => {
          const isCodex = s.provider === "codex";
          const badgeClass = isCodex ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800";
          const dateStr = s.updated_at ? s.updated_at.substring(0, 10) : "";
          const isSelected = s.session_id === selectedSessionId;
          const snippetHtml = s.snippet ? `<div class="mt-1 text-xs text-gray-500 bg-gray-50 p-1.5 rounded border border-gray-100">${s.snippet}</div>` : '';

          return `
            <div class="session-item p-3.5 hover:bg-indigo-50/50 cursor-pointer transition ${isSelected ? 'bg-indigo-50 border-l-4 border-indigo-600' : ''}" 
                 onclick="selectSession('${s.session_id}')">
              <div class="flex items-center justify-between mb-1">
                <span class="px-1.5 py-0.5 text-[10px] font-bold rounded ${badgeClass}">${s.provider.toUpperCase()}</span>
                <span class="text-[11px] text-gray-400 font-mono">${dateStr}</span>
              </div>
              <h3 class="text-xs font-semibold text-gray-900 leading-snug truncate mb-1" title="${s.title}">${s.title}</h3>
              <p class="text-[11px] text-gray-400 truncate mb-1 font-mono">${s.project_path || ''}</p>
              ${snippetHtml}
            </div>
          `;
        }).join("");

      } catch (e) {
        sessionList.innerHTML = `<div class="p-6 text-center text-xs text-red-500">エラーが発生しました</div>`;
      }
    }

    async function selectSession(sid) {
      selectedSessionId = sid;
      document.querySelectorAll(".session-item").forEach(el => {
        el.classList.remove("bg-indigo-50", "border-l-4", "border-indigo-600");
      });
      loadSessions(); // update highlight

      emptyState.classList.add("hidden");
      sessionHeader.classList.remove("hidden");
      messagesContainer.classList.remove("hidden");
      messagesContainer.innerHTML = `<div class="p-12 text-center text-gray-400 text-sm">セッションを読み込み中...</div>`;

      try {
        const res = await fetch(`/api/session/${sid}`);
        currentSessionData = await res.json();
        
        const info = currentSessionData.info || {};
        sessionTitle.textContent = info.title || "Session";
        sessionTitle.title = info.title || "";
        sessionProject.textContent = `📁 ${info.project_path || 'N/A'}`;
        sessionTime.textContent = info.updated_at ? info.updated_at.replace("T", " ").substring(0, 19) : "";

        const isCodex = info.provider === "codex";
        badgeProvider.textContent = (info.provider || "").toUpperCase();
        badgeProvider.className = isCodex 
          ? "px-2 py-0.5 text-xs font-bold rounded uppercase bg-emerald-100 text-emerald-800"
          : "px-2 py-0.5 text-xs font-bold rounded uppercase bg-amber-100 text-amber-800";

        renderMessages();

      } catch (e) {
        messagesContainer.innerHTML = `<div class="p-12 text-center text-red-500 text-sm">セッションの読み込みに失敗しました: ${e}</div>`;
      }
    }

    function renderMessages() {
      if (!currentSessionData || !currentSessionData.messages) return;

      const showThinking = toggleThinking.checked;
      const showTools = toggleTools.checked;
      const messages = currentSessionData.messages;
      const provider = (currentSessionData.info.provider || "").toUpperCase();

      const html = messages.map(msg => {
        const role = msg.role;
        const type = msg.type;
        const ts = msg.timestamp ? msg.timestamp.substring(11, 19) : "";

        if (type === "reasoning") {
          if (!showThinking) return "";
          return `
            <div class="border border-purple-200 bg-purple-50/50 rounded-lg p-3 text-xs text-purple-900">
              <div class="font-bold mb-1 flex items-center space-x-1 text-purple-700">
                <span>🧠 思考プロセス (Thinking)</span>
                <span class="text-[10px] text-purple-400 font-mono">${ts}</span>
              </div>
              <div class="whitespace-pre-wrap font-mono text-[11px] leading-relaxed">${escapeHtml(msg.content)}</div>
            </div>
          `;
        }

        if (type === "tool_call") {
          if (!showTools) return "";
          return `
            <div class="border border-gray-200 bg-gray-100/70 rounded-lg p-3 text-xs font-mono">
              <div class="font-bold text-gray-700 mb-1">🛠️ ツール呼び出し: <span class="text-indigo-600">${msg.name}</span> <span class="text-[10px] text-gray-400">${ts}</span></div>
              <pre class="bg-gray-800 text-gray-100 p-2 rounded text-[11px] overflow-x-auto">${escapeHtml(msg.arguments || '')}</pre>
            </div>
          `;
        }

        if (type === "tool_output") {
          if (!showTools) return "";
          return `
            <div class="border border-gray-200 bg-white rounded-lg p-3 text-xs font-mono">
              <div class="font-bold text-gray-500 mb-1">📥 ツール実行結果 <span class="text-[10px] text-gray-400">${ts}</span></div>
              <pre class="bg-gray-50 text-gray-700 p-2 rounded border border-gray-200 text-[11px] overflow-x-auto max-h-48">${escapeHtml(msg.content || '')}</pre>
            </div>
          `;
        }

        if (role === "user") {
          return `
            <div class="flex flex-col items-end">
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-xs font-bold text-gray-700">あなた (User)</span>
                <span class="text-[10px] text-gray-400 font-mono">${ts}</span>
              </div>
              <div class="bg-indigo-600 text-white p-4 rounded-2xl rounded-tr-sm max-w-3xl shadow-sm text-sm whitespace-pre-wrap leading-relaxed">
                ${escapeHtml(msg.content)}
              </div>
            </div>
          `;
        }

        if (role === "assistant") {
          return `
            <div class="flex flex-col items-start">
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-xs font-bold text-gray-700">🤖 Assistant (${provider})</span>
                <span class="text-[10px] text-gray-400 font-mono">${ts}</span>
              </div>
              <div class="bg-white border border-gray-200 p-5 rounded-2xl rounded-tl-sm max-w-4xl shadow-sm text-sm text-gray-900 prose prose-sm max-w-none">
                ${marked.parse(msg.content || '')}
              </div>
            </div>
          `;
        }

        return "";
      }).join("");

      messagesContainer.innerHTML = html || `<div class="p-12 text-center text-gray-400 text-sm">表示できるメッセージがありません</div>`;
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initial load
    loadSessions();
  </script>
</body>
</html>
